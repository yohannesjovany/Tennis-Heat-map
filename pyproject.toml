[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/core",
    "libs/detectors",
    "libs/trackers",
    "libs/court",
    "libs/heatmap",
    "libs/pipeline",
    "apps/cli",
    "apps/api",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
