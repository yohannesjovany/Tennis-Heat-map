[project]
name = "tennis-heatmap-api"
version = "0.1.0"
description = "FastAPI REST API + Web UI for the tennis heatmap system"
requires-python = ">=3.11"
dependencies = [
    "tennis-heatmap-pipeline",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
tennis-heatmap-pipeline = { workspace = true }
