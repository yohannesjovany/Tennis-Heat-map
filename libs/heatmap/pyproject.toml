[project]
name = "tennis-heatmap-heatmap"
version = "0.1.0"
description = "Heatmap generation, KDE rendering, and export for the tennis heatmap system"
requires-python = ">=3.11"
dependencies = [
    "tennis-heatmap-core",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pillow>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_heatmap"]

[tool.uv.sources]
tennis-heatmap-core = { workspace = true }
