[project]
name = "tennis-heatmap-core"
version = "0.1.0"
description = "Core interfaces, data models, and plugin registry for the tennis heatmap system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_heatmap"]
