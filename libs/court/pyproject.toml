[project]
name = "tennis-heatmap-court"
version = "0.1.0"
description = "Tennis court detection and homography-based coordinate projection"
requires-python = ">=3.11"
dependencies = [
    "tennis-heatmap-core",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_heatmap"]

[tool.uv.sources]
tennis-heatmap-core = { workspace = true }
