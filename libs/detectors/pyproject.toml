[project]
name = "tennis-heatmap-detectors"
version = "0.1.0"
description = "Pluggable detector implementations for the tennis heatmap system"
requires-python = ">=3.11"
dependencies = [
    "tennis-heatmap-core",
    "ultralytics>=8.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

# Detectron2 is not listed here as an optional dep because it has no
# standard PyPI wheel; install it manually from source if needed.
# See: https://detectron2.readthedocs.io/tutorials/install.html

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_heatmap"]

[tool.uv.sources]
tennis-heatmap-core = { workspace = true }
